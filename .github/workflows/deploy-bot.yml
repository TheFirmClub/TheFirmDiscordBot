name: Deploy Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Notify Discord Deployment Started
        shell: powershell
        run: |
          $mention = "<@&1393590761953558608>"
          $embed = @{
            title = ":rocket: Deployment Started"
            description = "A deployment has started on branch **$env:GITHUB_REF_NAME** by **$env:GITHUB_ACTOR**."
            color = 3447003  # Blue color
            timestamp = (Get-Date).ToString("o")
            footer = @{ text = "GitHub Actions • TheFirm Bot" }
            author = @{
              name = "$env:GITHUB_ACTOR"
              url = "https://github.com/$env:GITHUB_ACTOR"
              icon_url = "https://github.com/$env:GITHUB_ACTOR.png"
            }
          }

          $body = @{
            content = $mention
            embeds = @($embed)
          } | ConvertTo-Json -Depth 10 -Compress

          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method POST -Body $body -ContentType 'application/json'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Publish bot
        run: dotnet publish -c Release -o publish

      - name: Stop bot service
        shell: powershell
        run: 'C:\Tools\nssm\nssm.exe stop TheFirmDiscordBot'

      - name: Copy files to deployment folder
        shell: powershell
        run: Copy-Item -Path ./publish/* -Destination "C:\\FirmDiscordBot\\publish" -Recurse -Force

      - name: Start bot service
        shell: powershell
        run: 'C:\Tools\nssm\nssm.exe start TheFirmDiscordBot'

      - name: Notify Discord Deployment Succeeded
        if: success()
        shell: powershell
        run: |
          $embed = @{
            title = ":white_check_mark: Deployment Succeeded"
            description = "Deployment succeeded on branch **$env:GITHUB_REF_NAME** by **$env:GITHUB_ACTOR**."
            color = 3066993 # Green
            timestamp = (Get-Date).ToString("o")
            footer = @{ text = "GitHub Actions • TheFirm Bot" }
          }

          $body = @{
            embeds = @($embed)
          } | ConvertTo-Json -Depth 10 -Compress

          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method POST -Body $body -ContentType 'application/json'

      - name: Notify Discord Deployment Failed
        if: failure()
        shell: powershell
        run: |
          $embed = @{
            title = ":x: Deployment Failed"
            description = "Deployment failed on branch **$env:GITHUB_REF_NAME** by **$env:GITHUB_ACTOR**."
            color = 15158332 # Red
            timestamp = (Get-Date).ToString("o")
            footer = @{ text = "GitHub Actions • TheFirm Bot" }
          }

          $body = @{
            embeds = @($embed)
          } | ConvertTo-Json -Depth 10 -Compress

          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method POST -Body $body -ContentType 'application/json'
